# SecurePi kas build manifest (Yocto Scarthgap 5.0 LTS)
#
#   kas checkout kas.yml   # clone upstream layers (e.g. for browsing)
#   kas build kas.yml      # clone layers + build securepi-image
#
# This file pins every upstream layer; it is the source of truth for versions.

header:
  version: 14

machine: raspberrypi5
distro: securepi
target: securepi-image

repos:
  # Core Yocto build system and base layer set
  # Provides: meta (base recipes), meta-poky (distro policy baseline)
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    path: yocto/poky
    layers:
      meta:
      meta-poky:

  # Raspberry Pi 5 Board Support Package
  # Provides: machine config, GPU firmware, kernel patches, bootloader config
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: scarthgap
    path: yocto/layers/meta-raspberrypi

  # The SecurePi layer, kept in this repository (not cloned by kas)
  meta-securepi:
    path: yocto/layers/meta-securepi

