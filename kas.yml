# SecurePi kas build manifest (Yocto Scarthgap 5.0 LTS)
#
#   kas checkout kas.yml   # clone upstream layers (e.g. for browsing)
#   kas build kas.yml      # clone layers + build securepi-image
#
# This file pins every upstream layer; it is the source of truth for versions.

header:
  version: 14

machine: raspberrypi5
distro: securepi
target: securepi-image

repos:
  # Core Yocto build system and base layer set
  # Provides: meta (base recipes), meta-poky (distro policy baseline)
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    path: yocto/poky
    layers:
      meta:
      meta-poky:

  # Raspberry Pi 5 Board Support Package
  # Provides: machine config, GPU firmware, kernel patches, bootloader config
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: scarthgap
    path: yocto/layers/meta-raspberrypi

  # The SecurePi layer, kept in this repository (not cloned by kas)
  meta-securepi:
    path: yocto/layers/meta-securepi

  # Development-only layer: originally for SSH access before Debug Probe arrived.
  # Disabled: Debug Probe is now the access method. Re-enable only if needed.
  # meta-securepi-dev:
  #   path: yocto/layers/meta-securepi-dev

# meta-openembedded
# Provides: extended package set required by meta-selinux and meta-security
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    path: yocto/layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

# meta-selinux, meta-security
# Provides: SELinux policy framework, security tooling (checksec, aide, etc.)
  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: scarthgap
    path: yocto/layers/meta-selinux
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: scarthgap
    path: yocto/layers/meta-security
  # meta-tpm is a sublayer inside meta-security: no separate clone needed,
  # referenced as a local path so kas adds it to BBLAYERS without re-cloning.
  # Provides tpm2-tools, tpm2-tss
  meta-tpm:
    path: yocto/layers/meta-security/meta-tpm

  # meta-lts-mixins (scarthgap/u-boot branch)
  # Required for RPi5 (BCM2712) U-Boot support. Scarthgap ships U-Boot 2024.01
  # which cannot query DRAM size on BCM2712 (mailbox interface changed).
  # meta-lts-mixins provides U-Boot 2024.07+ with proper BCM2712 support.
  # meta-raspberrypi commit 6d59364 explicitly requires this layer for RPi5.
  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: scarthgap/u-boot
    path: yocto/layers/meta-lts-mixins
