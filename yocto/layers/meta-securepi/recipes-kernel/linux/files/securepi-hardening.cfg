# Kernel hardening config fragment for SecurePi
# Applied on top of meta-raspberrypi defconfig via SRC_URI in the bbappend.
# Populated in a later stage: options added progressively as each topic is studied.
#
# To validate: bitbake linux-raspberrypi -c kernel_configcheck

# ── Kernel hardening ──────────────────────────────────────────────────────

# Stack protector (strong variant covers more code paths than basic)
# CONFIG_CC_STACKPROTECTOR_STRONG=y      # uncomment in a later stage

# Randomize kernel base address (KASLR)
# CONFIG_RANDOMIZE_BASE=y                # uncomment in a later stage

# Restrict /dev/mem and /dev/kmem access
# CONFIG_STRICT_DEVMEM=y                 # uncomment in a later stage
# CONFIG_IO_STRICT_DEVMEM=y              # uncomment in a later stage

# Enforce W^X (no kernel memory both writable and executable)
# CONFIG_STRICT_KERNEL_RWX=y             # uncomment in a later stage
# CONFIG_STRICT_MODULE_RWX=y             # uncomment in a later stage

# Restrict kernel pointer exposure in /proc
# CONFIG_SECURITY_DMESG_RESTRICT=y       # uncomment in a later stage

# ── SELinux ───────────────────────────────────────────────────────────────

# CONFIG_SECURITY_SELINUX=y              # uncomment in a later stage
# CONFIG_SECURITY_SELINUX_BOOTPARAM=y    # uncomment in a later stage
# CONFIG_SECURITY_SELINUX_DEVELOP=y      # uncomment in a later stage (permissive dev)

# ── dm-crypt + dm-verity ──────────────────────────────────────────────────

# CONFIG_DM_CRYPT=y                      # uncomment in a later stage
# CONFIG_DM_VERITY=y                     # uncomment in a later stage
# CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y # uncomment in a later stage

# ── Trusted execution (planned) ───────────────────────────────────────────

