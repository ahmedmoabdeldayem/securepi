# SecurePi kernel hardening config fragment
# Applied on top of meta-raspberrypi defconfig via SRC_URI in the bbappend.
#
# To validate after build: bitbake linux-raspberrypi -c kernel_configcheck

# ── Kernel hardening ──────────────────────────────────────────────────────

# Stack smashing detection: strong variant covers more code paths
CONFIG_CC_STACKPROTECTOR_STRONG=y

# Randomise kernel load address: defeats static-address exploits
CONFIG_RANDOMIZE_BASE=y

# Bounds checking on all copies between user and kernel space
CONFIG_HARDENED_USERCOPY=y

# Restrict /dev/mem to first 1MB: blocks physical memory read/write
CONFIG_STRICT_DEVMEM=y

# Restrict /dev/mem IO regions entirely: no IO port memory access
CONFIG_IO_STRICT_DEVMEM=y

# Enforce W^X on kernel pages: no page both writable and executable
CONFIG_STRICT_KERNEL_RWX=y

# Enforce W^X on module pages
CONFIG_STRICT_MODULE_RWX=y

# Restrict dmesg to root: prevents KASLR bypass via kernel address leak
CONFIG_SECURITY_DMESG_RESTRICT=y

# Enable module signature verification: unsigned modules print a warning
# NOTE: MODULE_SIG_FORCE is not enabled yet (see the trusted-execution section)
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_SHA512=y

# Disable /proc/kcore: raw kernel memory accessible as a file
CONFIG_PROC_KCORE=n

# Disable debugfs: exposes tracing, kprobes, and GPIO to root
# In production there is no legitimate use for kernel debug interfaces
CONFIG_DEBUG_FS=n

# Disable kexec: prevents root from loading an unsigned kernel at runtime
# Without this, root could bypass secure boot by kexec-ing an unsigned kernel
CONFIG_KEXEC=n
CONFIG_KEXEC_FILE=n

# Disable Magic SysRq: UART console can trigger reboot/remount without auth
CONFIG_MAGIC_SYSRQ=n

# ── SELinux ───────────────────────────────────────────────────────────────
#
# Note: meta-selinux injects selinux.cfg only into linux-yocto recipes.
# RPi5 uses linux-raspberrypi, so we carry the full SELinux kernel config here.

# Master switch: enables the Linux Security Module (LSM) framework itself
CONFIG_SECURITY=y

# Mounts /sys/kernel/security/: selinuxfs lives under it; without this SELinux
# cannot initialize at all
CONFIG_SECURITYFS=y

# LSM network hooks: enforces SELinux policy on sockets and packets
CONFIG_SECURITY_NETWORK=y

# Socket/packet labeling for nftables integration (planned firewall)
CONFIG_NETWORK_SECMARK=y

# Extended attributes on ext4: SELinux stores file labels here
CONFIG_EXT4_FS_SECURITY=y

# Audit subsystem: required for AVC denial logging
CONFIG_AUDIT=y
CONFIG_AUDIT_GENERIC=y

# AVC cache statistics: visible in /sys/fs/selinux/avc/cache_stats
CONFIG_SECURITY_SELINUX_AVC_STATS=y

# Ordered list of active LSMs. Modern kernels ignore selinux=1 on the cmdline
# unless selinux appears here. capability must be first (base privilege checks),
# yama adds ptrace scope restrictions, integrity covers IMA/EVM.
CONFIG_LSM="capability,yama,selinux,integrity"

# Enable SELinux LSM: labels on every process, file, and socket
CONFIG_SECURITY_SELINUX=y

# Allow selinux=1/0 on the kernel cmdline: selinux=1 is set in securepi.conf
# as a safety net in case the compiled-in default is 0 on this kernel tree
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# Allow switching permissive/enforcing at runtime via setenforce
# Useful during policy development; disable for production (setenforce 0 becomes impossible)
CONFIG_SECURITY_SELINUX_DEVELOP=y

# Store the running kernel config in /proc/config.gz: essential for debugging
# config fragment application (e.g. grep SELINUX /proc/config.gz)
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ── dm-crypt + dm-verity ──────────────────────────────────────────────────

# Device Mapper core: virtual block device framework (dm-crypt runs on top of this)
CONFIG_BLK_DEV_DM=y

# dm-crypt target: transparent AES encryption/decryption of block device I/O
CONFIG_DM_CRYPT=y

# dm-verity target: Merkle-tree integrity checking of the root filesystem
CONFIG_DM_VERITY=y
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y

# dm-mod.create= kernel parameter: the kernel builds the verity root device
# itself from the command line, no initramfs needed. The table (with the root
# hash) lives in cmdline.txt inside the signed, measured boot.img.
CONFIG_DM_INIT=y

# AES cipher: the encryption algorithm used by LUKS2 (hardware-accelerated on RPi5)
CONFIG_CRYPTO_AES=y

# XTS mode: how AES is applied to disk sectors (AES-XTS-plain64 is the LUKS default)
CONFIG_CRYPTO_XTS=y

# SHA-256 for LUKS header integrity and key derivation
CONFIG_CRYPTO_SHA256=y

# Expose kernel crypto to userspace: cryptsetup benchmark uses this
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y

# Overlayfs built-in: volatile-binds mounts it at early boot before modules
# are available. =m causes the mount to silently fail or mount as ro on 6.12.
CONFIG_OVERLAY_FS=y

# ── TPM 2.0 over SPI (SLB9672 / SLB9670) ──────────────────────────────────

# RP1's SPI controller (snps,dw-apb-ssi) uses the DesignWare SPI driver.
# SPI_DESIGNWARE is the parent option (not SPI_DW, which does not exist in
# 6.12). With parent =m everything inside is capped at =m. Force both =y so
# the driver is built into the kernel Image and needs no module file.
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y

# TPM core subsystem: required by all TPM drivers
CONFIG_TCG_TPM=y

# SPI-attached TPM driver: handles SLB9670/SLB9672 and most discrete TPMs
CONFIG_TCG_TIS_SPI=y

# CR50 is Google's Chromebook-specific TPM variant: not needed for SLB9672
CONFIG_TCG_TIS_SPI_CR50=n

# Feed TPM hardware entropy into the kernel RNG (boosts /dev/random quality)
CONFIG_HW_RANDOM_TPM=y

