[Service]
# Privilege escalation: no child process can gain more privileges than syslogd starts with
NoNewPrivileges=yes

# Filesystem isolation
PrivateTmp=yes           # private /tmp, invisible to other processes
ProtectSystem=full       # /usr, /boot, /etc are read-only for this service
ProtectHome=yes          # /home, /root, /run/user are invisible

# Kernel protection: syslogd has no business touching kernel internals
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

# Network: syslogd only needs local Unix sockets, no TCP/UDP
RestrictAddressFamilies=AF_UNIX

# Memory: block writable+executable memory (shellcode prevention)
MemoryDenyWriteExecute=yes
