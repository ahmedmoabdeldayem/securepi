# SecurePi runtime kernel hardening
# Applied at boot by systemd-sysctl. 99- prefix ensures we override distro defaults.
# Reference: KSPP recommendations, CIS Benchmark Linux section 3

# ── Kernel pointer / info exposure ────────────────────────────────────────

# Hide kernel pointers from unprivileged users: defeats KASLR bypass via /proc
kernel.kptr_restrict = 2

# Restrict dmesg to root: kernel addresses visible in boot log
kernel.dmesg_restrict = 1

# Disable SysRq emergency key: UART console can trigger reboot/remount
kernel.sysrq = 0

# ── Memory protection ──────────────────────────────────────────────────────

# Full ASLR: randomise stack, VDSO, and mmap base addresses
kernel.randomize_va_space = 2

# Disable core dumps from SUID programs: core files may contain secrets
fs.suid_dumpable = 0

# Disable core dumps entirely: pipe to /bin/false discards them
kernel.core_pattern = |/bin/false

# ── Process isolation ──────────────────────────────────────────────────────

# Restrict ptrace to parent/child relationships: prevents cross-process memory read
# 0=unrestricted 1=parent only 2=root only 3=disabled
kernel.yama.ptrace_scope = 1

# ── Network hardening ──────────────────────────────────────────────────────

# Reject ICMP redirects: used to silently reroute traffic through an attacker
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Do not send ICMP redirects: we are not a router
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reject source-routed packets: attacker-specified routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Log packets with impossible source addresses (martians): helps detect spoofing
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# SYN cookies: mitigate SYN flood DoS
net.ipv4.tcp_syncookies = 1

# Ignore broadcast pings: prevents smurf amplification attacks
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Strict reverse path filtering: drop packets that arrived on the wrong interface
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable IP forwarding: this device is not a router
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
