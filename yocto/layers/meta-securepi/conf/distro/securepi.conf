# SecurePi distro configuration
# A minimal, hardened distro policy for the Raspberry Pi 5

require conf/distro/poky.conf

DISTRO = "securepi"
DISTRO_NAME = "SecurePi"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "scarthgap"

# rpi-bootfiles and rpi-u-boot-scr have COMPATIBLE_MACHINE = "^rpi$".
# raspberrypi5 has SOC_FAMILY = "rpi" so "rpi" IS in MACHINEOVERRIDES, making
# both recipes compatible. BitBake's orphan check fires before MACHINEOVERRIDES
# is fully resolved: false positive. Set WARNONLY so our bbappends are applied.
BB_DANGLINGAPPENDS_WARNONLY = "1"

# Remove features that expand attack surface
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pcmcia bluetooth 3g nfc"

# Keep networking and security features
DISTRO_FEATURES:append = " systemd usrmerge largefile pam tpm2"

# Use systemd as init
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"

# Compiler hardening flags: applied to every package
SECURITY_CFLAGS = "-fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wformat -Wformat-security -fpic"
SECURITY_LDFLAGS = "-Wl,-z,relro,-z,now"
SECURITY_X_FLAGS = "-fstack-protector-strong"

# Enable SSP (stack smashing protection) across the board
DISTRO_FEATURES:append = " security"

# dm-verity root filesystem (meta-security dm-verity-img class).
# do_image_ext4 also emits <image>.ext4.verity (data + appended hash tree) and
# ${STAGING_VERITY_DIR}/<image>.ext4.verity.env with the root hash and geometry.
# securepi-bootimg reads that env to put the verity table into cmdline.txt.
IMAGE_CLASSES += "dm-verity-img"
DM_VERITY_IMAGE = "securepi-image"
DM_VERITY_IMAGE_TYPE = "ext4"
# 4 KiB verity data blocks (class default is 1 KiB). The verity device then only
# accepts 4 KiB I/O, so ext4 must use 4 KiB blocks too: mke2fs picks 1 KiB for
# filesystems < 512 MB and the mount fails with "bad block size 1024".
DM_VERITY_IMAGE_DATA_BLOCK_SIZE = "4096"
EXTRA_IMAGECMD:ext4:append = " -b 4096"
# The class's default, set globally so securepi-bootimg (not an image) sees it too
STAGING_VERITY_DIR = "${TMPDIR}/work-shared/${MACHINE}/dm-verity"

# uutils-coreutils requires clang-native which is unavailable on this build host
SKIP_RECIPE[uutils-coreutils] = "Requires clang-native, which this build does not provide"

# Kernel 6.6 does not have the RP1 SPI driver (spi-rp1) needed for RPi5.
# 6.12 has full RP1 peripheral support: switch to it.
PREFERRED_VERSION_linux-raspberrypi = "6.12%"
PREFERRED_VERSION_linux-raspberrypi-v7 = "6.12%"

# Secure boot: U-Boot as bootloader, signed FIT images
# RPI_USE_U_BOOT tells meta-raspberrypi to build U-Boot and set kernel=u-boot.bin
# in config.txt so the EEPROM loads U-Boot instead of the kernel directly.
RPI_USE_U_BOOT = "1"

# FIT image: kernel + DTB bundled and signed. U-Boot verifies before loading
# KERNEL_IMAGETYPE (singular) is what meta-raspberrypi uses to generate boot.scr
# and populate IMAGE_BOOT_FILES. Setting it to fitImage makes boot.scr load
# fitImage with bootm (FIT boot) instead of Image with booti (raw kernel boot).
KERNEL_IMAGETYPE = "fitImage"
KERNEL_CLASSES:append = " kernel-fitimage"
IMAGE_BOOT_FILES:append = " fitImage"
# u-boot.dtb contains our RSA public key (embedded by uboot-sign.bbclass).
# boot.scr loads it at runtime and sets it as U-Boot's control FDT so bootm
# can find the key and enforce FIT signature verification.
IMAGE_BOOT_FILES:append = " u-boot.dtb"
# bootm is required for FIT images: booti is for raw Image only
KERNEL_BOOTCMD = "bootm"
# Override the default rpi-u-boot-scr boot script with our own that loads
# u-boot.dtb as the control FDT before booting the signed FIT image.
PREFERRED_PROVIDER_u-boot-default-script = "securepi-u-boot-scr"
# Mask upstream rpi-u-boot-scr so it doesn't conflict with our replacement.
# PREFERRED_PROVIDER selects the provider but doesn't stop the other recipe
# from building: BBMASK prevents BitBake from even parsing it.
BBMASK += "meta-raspberrypi/recipes-bsp/rpi-u-boot-scr/"

# RSA key used to sign the FIT image: private key signs at build time,
# public key is embedded into U-Boot's device tree and verified at boot
UBOOT_SIGN_ENABLE = "1"
UBOOT_SIGN_KEYDIR = "${TOPDIR}/../keys/fit-signing"
UBOOT_SIGN_KEYNAME = "securepi-fit-key"
UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
UBOOT_DTB_BINARY = "u-boot.dtb"

# RSA key used to sign the EEPROM firmware config: private key signs at build time,
# signed binary ships in the image and is flashed via rpi-eeprom-update on the device
EEPROM_SIGN_ENABLE = "1"
EEPROM_SIGN_KEYDIR = "${TOPDIR}/../keys/bootloader-signing"
EEPROM_SIGN_KEYNAME = "securepi-bootloader-key"

# boot.img signing: FAT32 image of the entire boot partition, required by the RPi5
# EEPROM in secure-boot mode (SIGNED_BOOT=1 in OTP). Same key as EEPROM signing.
BOOT_IMG_SIGN_ENABLE = "1"
BOOT_IMG_SIGN_KEYDIR = "${TOPDIR}/../keys/bootloader-signing"
BOOT_IMG_SIGN_KEYNAME = "securepi-bootloader-key"

# Include signed boot.img and its signature in the FAT boot partition so the
# WIC image is flash-ready without manual post-processing.
IMAGE_BOOT_FILES:append = " boot.img boot.sig"

# Replace the stock unsigned bootcode.bin (from rpi-bootfiles) with our
# customer-signed version. The BCM2712 BootROM reads bootcode.bin from the
# outer FAT to verify the customer RSA signature, which is what triggers
# program_pubkey=1 to actually burn the OTP. Appended last so it overwrites.
IMAGE_BOOT_FILES:append = " bootcode-signed.bin;bootcode.bin"

# Place the signed EEPROM firmware + its sig at the FAT root so the stock
# EEPROM (no SIGNED_BOOT) can self-update on first boot. Both pieeprom.upd
# (the firmware binary) and pieeprom.sig (sha256+timestamp) are REQUIRED:
# the EEPROM bootloader will not apply the update without a matching .sig.
# Prepended so both files land in the first FAT cluster (entry 0 & 1).
# Once SIGNED_BOOT=1 is active the EEPROM uses boot.img and ignores these.
IMAGE_BOOT_FILES:prepend = "pieeprom-signed.bin;pieeprom.upd pieeprom.sig "

# TPM 2.0: enable SPI bus and load the LetsTrust SLB9672 overlay.
# tpm-slb9670 overlay works for both SLB9670 and SLB9672 (same tpm_tis_spi driver).
# irq_gpio=25 matches the LetsTrust module's IRQ pin on the GPIO header.
RPI_EXTRA_CONFIG:append = "\ndtoverlay=tpm-slb9670,irq_gpio=25"

# Register the overlay dtbo with the WIC boot partition builder.
# make_dtb_boot_files transforms "overlays/X.dtbo" -> src=X.dtbo (deploy root),
# dest=overlays/X.dtbo (boot partition). RPI_EXTRA_IMAGE_BOOT_FILES uses the
# raw src;dest format, so source must be the deploy-root name (no overlays/ prefix).
# tpm-overlay recipe deploys tpm-slb9670.dtbo to ${DEPLOYDIR}/tpm-slb9670.dtbo.
RPI_EXTRA_IMAGE_BOOT_FILES:append = " tpm-slb9670.dtbo;overlays/tpm-slb9670.dtbo"

# SELinux: label every process and file, policy enforced by the kernel
DISTRO_FEATURES:append = " selinux"

# Enforcing: denials are blocked, not just logged. Set to "permissive" only
# while developing new policy.
DEFAULT_ENFORCING = "enforcing"

# meta-selinux's cmdline injection targets linux-yocto only (via GRUB APPEND).
# For RPi (linux-raspberrypi), we must set the cmdline directly.
# selinux=1 activates the SELinux bootparam: guards against the compiled-in
# default being 0 on the RPi kernel tree.
CMDLINE:append = " selinux=1"
