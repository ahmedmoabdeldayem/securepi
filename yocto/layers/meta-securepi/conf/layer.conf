# meta-securepi layer configuration
# Yocto Scarthgap (5.0 LTS) | Target: Raspberry Pi 5

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "securepi"
BBFILE_PATTERN_securepi = "^${LAYERDIR}/"
BBFILE_PRIORITY_securepi = "10"

LAYERDEPENDS_securepi = "core raspberrypi"
LAYERSERIES_COMPAT_securepi = "scarthgap"

# CVE check: recipes to skip (none by default; add with justification)
# CVE_CHECK_SKIP_RECIPE += "example-recipe"
