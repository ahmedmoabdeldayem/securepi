# Wi-Fi configuration for the OPTIONAL dev-access layer (meta-securepi-dev).
# This layer is disabled by default in kas.yml: the production image has no Wi-Fi.
#
# Fill in your own network before enabling the dev layer:
#   ssid : your network name
#   psk  : do NOT paste your plaintext password here. Generate the hashed PSK:
#            wpa_passphrase "YOUR_WIFI_SSID" "your-plaintext-password"
#          and copy the `psk=...` line it prints.
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=0
country=DE

network={
    ssid="YOUR_WIFI_SSID"
    psk=REPLACE_WITH_YOUR_WPA_PSK
    key_mgmt=WPA-PSK
}
