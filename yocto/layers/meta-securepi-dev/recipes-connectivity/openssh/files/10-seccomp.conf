[Service]
# Prevent syscall ABI switch to bypass filter (arm64 only, no 32-bit compat needed)
SystemCallArchitectures=native

# Baseline: everything a well-behaved system service legitimately needs
SystemCallFilter=@system-service

# Deny syscall groups that sshd has no business calling
# @obsolete: legacy syscalls removed from modern software
# @debug: ptrace and friends; no debugger should attach to sshd
# @module: init_module; sshd cannot load kernel modules
# @reboot: reboot/kexec_load; not a power manager
# @swap: swapon/swapoff; not a storage manager
# @cpu-emulation: modify_ldt etc.; 32-bit legacy, irrelevant on ARM64
SystemCallFilter=~@obsolete @debug @module @reboot @swap @cpu-emulation
