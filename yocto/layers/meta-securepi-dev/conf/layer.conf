# meta-securepi-dev: development-only layer
# Contains Wi-Fi credentials, SSH key, and debug tooling.
# Enable in kas.yml when hardware access is needed. Never activate in production builds.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "securepi-dev"
BBFILE_PATTERN_securepi-dev = "^${LAYERDIR}/"
BBFILE_PRIORITY_securepi-dev = "11"

LAYERDEPENDS_securepi-dev = "core raspberrypi securepi"
LAYERSERIES_COMPAT_securepi-dev = "scarthgap"

# Accept Wi-Fi firmware license: only needed when this dev layer is active
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"
